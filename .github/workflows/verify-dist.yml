name: Verify dist sync

on:
  pull_request:
    branches: [scp-main]
  push:
    branches: [scp-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate + build
        run: |
          npm run generate
          npm run build

      - name: Check dist/ is in sync with src/
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of sync with src/. Run 'npm ci && npm run generate && npm run build' locally and commit the result."
            git status dist/
            git diff --stat dist/
            exit 1
          fi
          echo "dist/ is in sync"
