name: Vendor dist

# The vendored dist/ is what `npx`-from-GitHub serves, so it must match a clean
# build of src/. Building it on a contributor's machine is fragile: a Windows
# build and this Ubuntu runner can disagree byte-for-byte (e.g. the generated
# Graph client), which made the old "fail if out of sync" check spuriously red.
# Instead, let CI own the build: rebuild on Linux and commit the canonical dist/
# back to scp-main whenever it drifts. The commit is tagged [skip ci] so it does
# not retrigger this (or any) workflow.

on:
  push:
    branches: [scp-main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-dist
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scp-main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate + build
        run: |
          npm run generate
          npm run build

      - name: Commit rebuilt dist/ if it drifted
        run: |
          if [ -z "$(git status --porcelain dist/)" ]; then
            echo "dist/ is already in sync — nothing to commit."
            exit 0
          fi
          echo "dist/ drifted from a clean Linux build — committing the canonical version:"
          git status --short dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: rebuild vendored dist/ on CI [skip ci]"
          git pull --rebase origin scp-main
          git push origin scp-main
